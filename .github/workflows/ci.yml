name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: scraper
          POSTGRES_DB: jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U scraper"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m playwright install

      - name: Run lint (ruff)
        run: |
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://scraper:scraper@localhost:5432/jobs
        run: |
          pytest